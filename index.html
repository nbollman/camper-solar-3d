<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Camper solar roof</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #14171c; color: #eef1f4;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    model-viewer { width: 100%; height: 100%; }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 14px 16px calc(18px + env(safe-area-inset-bottom));
      text-align: center; pointer-events: none;
      background: linear-gradient(transparent, #14171cf2 42%);
    }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; }
    p  { margin: 0; font-size: 17px; color: #c5ced6; line-height: 1.35; }
    .ar {
      pointer-events: auto; display: inline-block; margin-top: 10px;
      background: #4f9fc9; color: #0d1114; font-weight: 700; font-size: 18px;
      padding: 10px 16px; border-radius: 999px; text-decoration: none;
    }
  </style>
</head>
<body>
  <model-viewer
    src="https://cdn.jsdelivr.net/gh/nbollman/camper-solar-3d@main/s280bhss-solar.glb"
    ios-src="https://cdn.jsdelivr.net/gh/nbollman/camper-solar-3d@main/s280bhss-solar.usdz"
    poster="https://cdn.jsdelivr.net/gh/nbollman/camper-solar-3d@main/iso.jpg"
    alt="Travel trailer with two rows of blue solar panels"
    camera-controls auto-rotate auto-rotate-delay="800"
    rotation-per-second="16deg"
    shadow-intensity="0.9" exposure="1.2"
    environment-image="neutral"
    touch-action="pan-y"
    ar ar-modes="quick-look scene-viewer webxr">
  </model-viewer>
  <div class="bar">
    <h1>Drag with one finger to turn</h1>
    <p>Pinch to zoom · 6 solar panels on the camper</p>
    <a class="ar" rel="ar" href="https://cdn.jsdelivr.net/gh/nbollman/camper-solar-3d@main/s280bhss-solar.usdz">Open on iPhone</a>
  </div>
</body>
</html>
